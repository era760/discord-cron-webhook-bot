name: Daily Discord Post

on:
  schedule:
    # JST 午前8:00（UTC 前日23:00）
    - cron: '0 23 * * *'
  workflow_dispatch: # Actionsタブから手動テスト実行できるように設定

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Send Message to Discord
        run: |
          payload=$(jq -n --arg content "$MESSAGE" '{content: $content}')
          # URLの末尾に ?wait=true を付与 & curlにタイムアウト(-m 10)を設定
          curl -sS -m 10 \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$payload" \
               "${WEBHOOK_URL}?wait=true"
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE: ${{ secrets.DISCORD_MESSAGE }}
